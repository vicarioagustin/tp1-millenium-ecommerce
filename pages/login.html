<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millenium - Iniciar Sesión</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

    <header>
        <nav>            
            <a href="../index.html"> 
                <img src="../img/logo.png" alt="Logo Millenium" class="logo-img">
                <span class="logo-texto">Millenium</span>
            </a>
        </nav>
    </header>

    <main>
       <section class="form-container">
            <h1>Iniciar Sesión</h1>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="********">
                </div>
                
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <p class="form-link">¿No tienes cuenta? <a href="./registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Millenium</p>
    </footer>

</body>
</html>
