<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millenium - Registro de Usuario</title>
    <link rel="stylesheet" href="../styles/styles.css">    
</head>

<body>

    <header>
        <nav>
           
            <a href="../index.html"> 
                <img src="../img/logo.png" alt="Logo Millenium" class="logo-img">
                <span class="logo-texto">Millenium</span>
            </a>
        </nav>
    </header>

    <main>
       <section class="form-container">
        <h1>Crear Cuenta</h1>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu Nombre">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Tu Apellido">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="********">
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <p class="form-link">¿Ya tienes cuenta? <a href="./login.html">Inicia sesión aquí</a></p>
    </section>
    </main>

    <footer>
        <p>&copy; 2026 Millenium</p>
    </footer>

</body>
</html>
