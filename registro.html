<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millenium - Registro de Usuario</title>
    <link rel="stylesheet" href="estilos.css">    
</head>

<body>

    <header>
        <nav>
           
            <a href="index.html"> 
                <img src="logo.png" alt="Logo Millenium" class="logo-img">
                <span class="logo-texto">Millenium</span>
            </a>
        </nav>
    </header>

    <main>
        <h1>Crear Cuenta</h1>

        <form action="#" method="POST">
            <div>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu Nombre">
            </div>
            <br>
            <div>
                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" name="apellido" required placeholder="Tu Apellido">
            </div>
            <br>
            <div>
                <label for="email">Correo Electrónico:</label><br>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </div>
            <br>
            <div>
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password" required placeholder="********">
            </div>
            <br>
            <div>
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label><br>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
            <br>
            <div>
                <button type="submit">Registrarse</button>
            </div>
        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </main>

    <footer>
        <p>&copy; 2026 Millenium</p>
    </footer>

</body>
</html>
